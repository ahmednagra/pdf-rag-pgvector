services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag   # local development only
      POSTGRES_DB: rag
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://rag:rag@db:5432/rag
      TEST_DATABASE_URL: postgresql+psycopg://rag:rag@db:5432/rag_test
      MODEL_CACHE_DIR: /models
    ports:
      - "${API_PORT:-8080}:8000"
    volumes:
      - models:/models   # embedding model is downloaded once, then reused
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  models:
