[project]
name = "pdf-rag-pgvector"
version = "0.1.0"
description = "A small, honest RAG service over PDFs: FastAPI + PostgreSQL/pgvector, citations, tool calling and evals."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "alembic>=1.13",
    "pypdf>=5.0",
    "fastembed>=0.4",
    "openai>=1.50",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "fpdf2>=2.8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.uv]
# Lock versions that have wheels for Docker (Linux) and Apple-silicon Macs.
# (onnxruntime, used by fastembed, no longer ships Intel-Mac wheels: use Docker there.)
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]
